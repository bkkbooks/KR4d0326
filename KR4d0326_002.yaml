body:
  text: 方壺存稿卷二宋汪莘撰古詩五言春懷十首存四首黃鸝占髙枝蝴蝶戀芳草逹人能熙春兒女被春惱和風吹衣裳白日照懷抱天地為我園衆目一何小東皇行仲月南極現朱鳥虞帝被袗衣周王在靈沼于飛既覽德於仞亦知道感此彌恨長冉冉以空老神遊何邉方夢到迷處所論世非秦漢辨地豈吳楚碧桃依陽林翠霞蔭清渚鵾雞鳴花間鸞鶴將儔侣中有古玉堂日月光相貯似是重瞳君左右列二女我待再拜興帝復相爾汝蘧然形已開不得竟所語青天夫何長白日又何促吹却幾株花成此一村緑不嫌春己晚春晚愛不足誰能描晚春隱然在心曲我心如明鏡萬象相映燭我心如虗空萬物自磨觸斜陽紅欲滴逺水光可掬中有太古人歌聲出金玉日釀天正緑風酣麥方秋間携稚子輩眷言共春遊芒鞋過澗壑竹杖穿林丘東西隨所適語默頗自由亦有一樽酒父子相獻酬山花既含笑野草亦忘憂一輪漸隱隱半規尚悠悠歸路何所嘆古人可與謀春曉曉來雨初晴天宇淨如拭隔籬見花栁春氣亂五色東君渾不管但為間者得我方獵鵾鵬溟南復溟北蔣徑穿渠帶幽徑列竹依清流中有好鳥鳴暮鎖星辰稠北風攪雪花更覺龍鳯遒東皇憐嵗寒丹白如飛浮細履或得得長歌亦悠悠顧我非蔣卿何以致羊求竹澗呼匠琢山骨臨水起月臺一槃古月色竹影涼毰毸竹影如掃月月色掃不開居然廣寒宫桂枝苦低回便欲招謫仙蛾眉送瓊杯蛾眉見梅花思君弄青梅古詩七言黃山髙黃山髙哉巋然為江東之巨鎮兮壁立於兩浙之上遊摩天戛日以直上陽支隂派盤數州四海不知兩根本行人但覺雲飛浮嘗試芒鞋竹杖造乎其間兮一溪桃杏紅爛漫萬壑松柏寒颼颼懸崖絶磴可望不可到兮古木倒挂險更遒上有靈泉瀑布千萬道如銀河自天爭㵼而競注兮砅雷濺雪隱現穿林幽中有青鸞黃鶴千萬對雄倡雌和迭舞而交鳴兮深林自適復有雪白數點之猿猴山中自昔無歷日花開葉落成春秋殘英脫葉不知其所從來兮但見夫澗谷之間桃花如扇松花如纛竹葉如笠蓮葉如舟菖蒲九節餵白鹿靈芝三秀眠青牛人間三月春已暮洞中花卉春長留竒香異氣逐風去散落塵世誰能酬黃山髙哉雲際一峯尚可畫雲外一峯畫不得霜繒鋪了掉首休丹砂一峯燭天爭日月九龍一峯拔地張旗旒天都一峯傑出於三十六峯兮星斗森羅挂珠殿日月對展瓊瑶樓中有一人兮龍冠而鳳裘左容成兮右浮丘我時收却釣竿樵具作一束投諸曹阮溪中流浴余身兮湯泉風余袂兮帝所夔鼓隱隱兮管啾啾水精盤兮碧玉甌帝酌我兮勞我左右為余兮凝眸指余以南峯石壁記授余以紅鉛黑汞大丹頭黃山髙哉余將覽秀巢雲鍊其下坐令萬物不生疵癘黍盈疇新安黃山為吳越諸山之祖頃臨川孟侯在郡日怪余無黃山詩因賦此篇訪建康留守敬公太古明月鏡愛公九天寒露漿畏公龍泉太阿劍喜公斑虎花蛇囊月中含月作懷抱露表滴露生清涼風塵澒洞要英傑太平潤色須文章公昔荷橐侍紫皇公今握符坐建康綸巾羽扇夏日靜鳴鳩乳燕南風長青天有月來堂堂白鷺分水鳴湯湯城頭獨立是誰子身長七尺鬚眉蒼袖藏古劍咸陽市淚逐東風灑桃李一心只望金陵飛未到三更已千里北斗錯落垂寒光願公提起掃八荒刺人如影那見血激天孤竹和空桑訪曽侍郎青天蕩蕩摩青銅紫微將相環西東大鵬一擊九萬里兩翼不鼓乘長風大鵬飛到天門下天門無不聳觀者列星退步失光彩九虎低頭若凡馬有鳥決起搶榆枋望而不見空斷腸看天愈髙鵬愈逺豈不有意招八荒我捨新安來狂歌錢塘市上有無情之吳山下有傷心之江水春已暮人未歸平生不問鱖魚肥若教買得青山住飽食笋蕨歌春暉雞雛癸卯孟夏初三日賦負青抱黃圓如彈崑崙磅礴幽未判母雞春日宿雞栖躬抱乾坤入烹煆翼之腹之氣自蒸有時踏轉令交貫朦朦如困當晝中惺惺無眠過夜半食時莫怪喚不應凝然有在應難喚君不見隂陽氣足有超越恍惚惚恍生神觀數聲隔㲉聞淳音一點懸胎脫幽贊母雞慣事徐啄開可憐毛羽良毰毸却思裏許若為活跧伏性命能低回啄粟飲水孰教之天機自動曽何疑三三兩兩旋母腳出入南北相追隨纍然多寡乍磊落倐然後先無定著乘間疾數數不得往來旁午依前錯聞道輪回少安泊謫仙那能被法縛秋山歸來酒新熟呼童烹雞色自若殺與不殺莫忖度請君注目寒江倚山閣梧竹亭人家有園種花栁君家有園種梧竹花栁只引蜂蝶來梧竹能招鸞鳳宿昨君飲我池上亭亭邉梧竹深𡨕𡨕鎪風鏤月已足玩滴雨灑雪尤堪聽君不見梧君昔在岐山上開花與鳳作屏障又不見竹君昔在渭水陽結實與鳳充餱糧岐山渭水地差逺頗覺老鳳勞往返成周已去漢唐空梧亦無根竹無本君家甲第連朱扉碧梧翠竹相因依千年老鳳嘆何在一旦下集增光輝梧君竹君喜相遇鳳兮鳳兮君且住老鳳回頭謝二君吾方髙舉青天去律詩五言方壺自詠誰和陽春曲仍操白雪音郊寒猶有骨島瘦未無心雲到散時看月當虧處尋可憐持玉尺終不度金針直寫胸中事誰粘紙上塵興來那暇懶得處不容論行有鬼神覷時防天地嗔歐蘇尋後輩郊島是前身開禧元年四月自中都挈家還鄉寓居城南十二月遷居栁溪上其夜大雪初二日蓋宰來訪約過縣齋為一日欵深夜而歸賦此出郭已超俗住溪尤近真青天素知我白雪便隨人守道何妨賤藏書不盡貧長懷社中友共發甕頭春世事偏宜假吾生只認真少知行路惡老愛在家貧寧接古時鬼怕逢今世人澗松方卧雪野草亦爭春羣處那相合單棲正自如好言天外事懶讀世間書指直筆難把唇濡硯屢噓傾壺有餘瀝窺甕得殘菹每恨投南鵲尤憐向北枝雖蒙今士笑恐有後人思運火解朝凍咽津充夜飢不來溪上住那得雪中詩徹骨寒誰覺回骸暖自醒直須人悄悄方得物亭亭性伏涵三極心開燭萬靈有僧肥擁腫怪我瘦竛􅀈茅屋凍將壓柴扉寒不開交朋幾竿竹兄弟數枝梅渡口月初出沙頭人正回闕積雪滴還凍斜陽隂復明千峯濃淡碧一水淺深清闕律詩七言夀髙內翰鶴立青松老令威佳辰山水倍清輝曽扶東壁排雲出幾跨蒼龍帶雨飛竹簟水風須得意玉堂春日即催歸願公與國為梁棟千載煌煌照太微夀髙祕書萬壑千巖映翠霞越王城下競傳誇青天白日祕書舫乳燕鳴鳩內相家髙浪趣潮滄海直大鵬橫擊五雲斜自吹玉笛相為夀昨夜菖蒲吐紫花夀何尚書雪艇風帆去玉京故家猿鶴想歡迎九天氣母壺中足十月嬰兒頂上行曽問何修能至此但云無欲自然成夜來夢向山莊立一炷清香徹太清寄商察院飛卿嘉定四年秋竊伏西湖雪鬢催長歌聲斷鬼神哀青天有月無人看白帝行秋待我來近水逺山俱冷淡敗荷孤葦尚低徊今朝欲向青門道出到踈籬意已灰玉堂中賡任宫講希夷惠詩韻宫講先生句字香晦菴衣鉢有餘芳松篁性本參天直楊栁情仍庇地長自恨此身真逆旅不知何日更傳觴山人初向山中出還欲歸來水一方中秋月萬派寒芒一道飛隂精盛處逺成圍抱回紅日浴東井橫截碧天朝太微惟有中秋金正王復當子夜水生肥溶溶滿掬乾坤髓説向傍人是泄機佛書載兜率天有內院道書有赤城朱忩乃帝一內宅因述所聞結髮師心內院行紫雲門闕碧霞城一聲霹靂衝天響萬點星辰匝地明鼎裏金丹能虎變床頭鐡杖帶龍腥極知富貴非吾事玉簡朱繒有姓名夜興倚天長劍為誰收欲獻君王鎮九州世事漫隨紅日下壯心空逐碧江流鴈橫西塞偏愁客菊綻東籬始當秋抖擻向來塵土夢便提簔笠上漁舟摘句天下山川居一半湖州風月占三分初出海張紅錦扇到中天挂水晶毬兔蟾迸作雙輪現金火鎔成一鑑秋笠澤漁舟都不問醉中倒著緑蓑衣闕比作鈎圓作鑑待見太平心始足不妨歸去老樵漁方壺存稿卷二
