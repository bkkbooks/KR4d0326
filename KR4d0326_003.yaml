  text: 欽定四庫全書
  hash: sha256:64d9ff2e7643d8cd3464e7f4c9e75c7d6d85eb6ee80c540d6dcbeeab187b9ddc
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0326_WYG_003-1a, image: WYG1178/WYG1178-0131a.png}
body:
  text: 方壺存稿卷三宋汪莘撰絶句七言秋懷秋雲無復似春濃天地何人到此窮斜日淡烟今古恨如何都付與孤鴻四野秋風交敝廬時平不用藺相如有人來問生涯事指㸃蓑衣學釣魚傷春未了又悲秋無復歡悰到酒舟茅屋半欹籬半倒伏羲一卷在床頭玉露金風刮夜天踈桐缺月耿忩前十詩未盡窮愁志說與家僮汝自眠一帶峯巒失舊青荻花楓葉夕陽明閒思天上多官府自是幽人道未成北渚風生木葉秋洞庭波起夕陽收楚人臨水為誰立帝子隔煙相對愁次潘別駕韻野店溪橋栁色新千愁萬恨為何人殷勤織就黃金縷帶雨籠烟過一春潘別駕自祈門回白馬嘶風入紫陽使君一笑列壺觴秋原是處堪圖畫豆子花紅稻半黃九月十六日出郡登舟如錢塘十七日舟中雜興落日扁舟萬古心半山明耀半溪隂漁鹽商賈都來往縱有客星何處尋一簇沙鷗占白波手搖雙漿呌吳歌大羅只許詩人上不許閒人上大羅天地窮時事亦窮最傷心處是凉風少年每下悲秋淚投老情知淚亦空白雲晚向山中出白霧朝從水上生三百里灘轟電過鬼神驚倒怒龍聲日暮滄江駐客舟眼前境界起詩愁沿山幾處人烟僻摘粟收麻到白頭巍然釣石壓江濱烟水茫茫斷四鄰天帝座邉元是客劉郎何得欲相臣逰南山山溪黃葉從過滿石案蒼苔不用除壇上古松岩畔竹切須留伴老僧居送趙君歸去苕溪理釣篷風清月白水晶宫青蓮居士爭閒得時答天書一兩通練水至清無淺深使君何日再登臨請看江上千株栁盡是居民離別心有客胸藏太息書蕭蕭白髮不堪梳君王若問江東士莫只相憐誦子虗秋興天外涵天心廣大月中吐月性光明夜來飛上崑崙頂獨倚瓊樓笑一聲一旦秋風起洛濱東歸聊復寄鱸蓴如今已在漁鄉住宜與清朝作散人七尺經霜翠竹竿斬來石壁釣江湍絲頭垂下驪龍口掣得明珠似月寒秋天尤覺曉天清仰首看天俯首行不但長歌聲似鶴一身渾似鶴般輕去昌化縣西四十里留宿陳東魯南樓碧玉山中白玉溪武陵村落午時雞南樓一覺春宵雨夾路桃花送馬蹄三月十九過松江在家每憶松江好及到松江又憶家夢見樵青來竹裏笑將漁父插桃花笠澤滄波擁洞庭望中七十二峯青待偕龍女乘雲去占去參天一畫屏寓清湖橋夜枕聞雨要識人間過去愁春宵風雨到湖樓如今此恨無分處應有知人在後頭晚晴即事君平簾外雨霏霏寂寞何人識少微怪得湖邉天色好小舟爭載夕陽歸夏日西湖閒居十首存八首急管繁弦樽爼閒何人靜眼對湖山怪來水面無鷗鷺多在殘蒲落照灣晚風吹動碧琳寒初日花房露未乾誰道幽人無伴侣紅蕖萬朵竹千竿十里湖山苦見招栁堤荷蕩赤欄橋待他朝市人歸後獨泛扁舟吹玉簫每嘆西湖境未除向來人物有還無紅蕖緑竹渾相得明月清風亦不孤一曲波光徹太虗四垂碧漢罩逰魚逰人眼被荷花礙不覺琉璃泡裏居露冷風清斗柄遷芙蕖零落謝家船都人正作黃粱夢獨占西湖明月天清夜湖心把酒杯花間風月共徘徊金鐘何事催天曉又恐逰人相逐來藕蒂嚼來殊解渴荷香聞得亦忘飢幽人不趂槐花課收得西湖幾句詩感白髮一枕黃粱夢欲殘死生大海浪漫漫鬢邉白髮休除却時向忩前把鏡看夜興簟紋如水浸蟾光睡覺湖邉月半床道是廣寒疑不是月中那得藕花香泛小舟入蓮蕩微雨即事水光如錦葉如烟微雨相從到洞天翠蓋紅粧無處避一時挨入木蘭船臘月雪後林下雪消添晚汲山中日出缺晨炊先生茅屋春尤早只有階前碧草知遷入新居後客至偶成開禧三年五月方壺客去偃雲床槐栁隂隂日自長睡起不知天早晚問人山頂是斜陽春夏之交風雨彌旬耳目所觸即事十絶存四首石橋南北碧桃香翠葉交柯水面凉終嵗方壺無一事春來也為種花忙野水平橋細浪生柴門草長斷人行園林霽後春如在燕雀鳴時夏正清雷電隂晴共一簾殘春首夏境相兼閒尋稚笋今朝長靜數新荷昨夜添簷前花放不忍折庭下草深仍懶除苦雨晴時春已盡可憐新月掛清虗自去秋疾作正月尚未全愈曉枕有懷插栁栽花便滿林午天蜂蝶曉天禽老來病損渾無力報答春光只有心寒食節有感江南兒女尚多情為愛芳晨載酒行幸自不知惆悵事鳥啼花落是清明昌化縣西廣福寺前嶺上有古松一株甚竒每過其下徘徊不能去今夏五月過之始賦一絶虎攫龍跧數百秋灘聲長繞半天流老僧不與人間事獨立門前一㸃頭臘月晚過陽村寫望萬里溪光一望穿潛魚世界白鷗天若為移得溪光去落日茅齊相對眠立春日山行逺山殘雪獻年華翠黛千層蹙浪花天下畫屏描不得懶移皮屐下鄰家籬隂籬隂雙蝶趂春暉輕展新黃試舞衣㸃草撲花如得意因何相逐背人飛仲春溪行即事竹外夭桃分外明一枝折得繞溪行春風誰道全無主蝴蝶飛來花上爭栁枝詞繅出烟絲輕裊裊掃成雪帚重垂垂風流舉世無過栁總合殷勤把一枝已酉夏偶興兩燈射壁兩重光一影俱生一影傍假使百燈同一室百身還只一身忙八月間書案假寐戲作四海春風曲肱裏出入鼻端雲一縷不知案上清露珠漏泄傅岩夢中雨甲寅西歸江行春懷十首存六首江行二月正清新無主桃花不戀春老去情懷甚年少少年未解惜芳辰薄晚東風一岸巾波光挾日戰龍鱗尋思來往成何事只向人間得此人香韉繡軛急朝昏李陌桃蹊不盡樽滿席落花人睡起始知春興屬柴門塞空春意總分明桃李無言却混成剛被幽禽知此意風前拈出兩三聲白晝春光緑染衣東風千里掛帆歸竹籬紅白花相映只聽雞聲在翠微繞屋桃花可得追迎門猶有海棠枝牡丹未放酴醿小併入青梅煮酒時八月十一日夜作文起夜興㸃墨揮毫勢始停起來耳目共時醒一忩月色原無嚮四壁蟲聲不見形感秋閒佩仙瓢到栁汀栁邉一㸃酒旗星斜陽欲落無人惜空有烟林作畫屏天文栁星邉有酒旗星行到籬邉菊已黃相逢不改舊時香自憐失意秋風後猶為寒花一舉觴不須龜筮此生休死去無心更出頭莫說竹籬茅舍事丹楓一樹正悲秋獨步荒山日欲昏數聲乾葦過逰魂重岡復澗穿難盡恍惚隨人月一痕壬戌嵗春懷病起南臯二月時鏡中樗散鬢成絲不因雀噪簷間樹春雪春晴總不知抱疾衡門與藥親苦無筋力尚精神東風日夜開桃李不為人間失意人摘句碧天似水原非水碧水如天不是天日歸海底龍方覺月到天心虎正眠水邊楊栁怯秋風憶昨杏花相映紅壓架春風十萬條護簷雙幹自蕭蕭杜鵑啼後已無春金風玉露玻璃月併作詩人富貴秋斷紅池館無人到猶有黃鸝一兩聲槐葉風清鶯哺子麥苗露濕雉尋媒玉龍嘶罷還家晚月出蓬萊第一峯花葉同心縮翠拳蓮子碧縠水邊搓栁線緑羅天畔繡桃花方壺存稿卷三
