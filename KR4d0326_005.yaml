body:
  text: 徐誼書誼頓首再拜叔耕祕正契友誼妄意欲以文學履行上之於朝前書已常略陳之矣今移牒州縣使備書吏筆札就宅上抄録著述又嘗以書囑南老運幹董督其事若春間畢事便當從南昌附奏恐州縣未悉此意先自納之官劵以為紙筆之需辱領略幸甚百懷續得叙布不宣誼頓首再拜
