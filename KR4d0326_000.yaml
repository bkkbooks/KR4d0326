body:
  text: 方壺存稿别集類三宋提要臣等謹案方壺存稿四卷宋汪莘撰莘字叔耕休寧人嘉定間以布衣上封事不用退而築室栁溪之上囿以方渠自號方壺居士是編第一卷為書辨序説歌行第二卷第三卷為古今體詩第四卷為詩餘前有程珌孫嶸叟王應麟三序莘與朱子真德秀皆相善然集首辭晦菴朱侍講書反覆以調和兩宫責望朱子至稱建明稍緩非特不能為天下學道者之地亦不能為後世學道者之地其言剴切耿直相規以善非茍邀奬借者比朱子答書今未見而集中別有與莘兩書一書頗以好論説喜文章為戒今觀其集諸文皆排宕有竒氣詩源出李白而天姿髙秀不及之故往往落盧同蹊徑雖非中聲然亦不俗其於詩餘亦稱作手平生所愛者蘇軾朱希真辛棄疾三人嘗謂為詞家三變所賦每多摹仿其體欲以粗豪見長頗不免于習氣而大致疏落可觀亦南宋一竒士也卷末載徐誼書稱移牒州縣使書吏録其著述則當時原有全集行世其後嵗久散佚裔孫循等復就其存者輯而傳之故以存稿為名而世所行本往往彼此異同未詳其故殆其子孫各有所輯録故不免於增損移易耳莘以封事得名孫嶸叟序作于咸淳辛未己稱三疏不可見則當時已毁其草故集中亦不載云乾隆四十三年九月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀方壺存稿原序太史公發憤作史記百三十篇而列傳首孤竹君之子乃復續之以力拔山之項羽何哉以其敘屈原賈誼亦復抑揚詞旨且自言發詩書之隱約葛稚川謂送往者以思來者又謂其為一代之偉才不其然乎叔耕藴霞箋玉牒之竒思出天表蓄而不試憂深思逺未易遽班之賀白也嶧山積石三十二里孤桐琴瑟而鄒魯地接古稱多儒休寧斷崖鵝石之秀江南鮮比君殆一竒乎僕頃為史官不能取君傳之逸民今一念之歉然未己然猶有期於來者姑以此編置之方壺秋菊寒泉振我清風豫心往矣于以辭其責可乎端平乙未臘月二十五日洺水遺民程珌謹書新安人物以韋齋龍溪為稱首方壺居士抱邁往軼羣之氣頥神天隱髙蹈物表不屑習舉子業以絓名利之網發為文章雄壯竒偉飄飄然如馭風騎氣與造物者逰無一點煙火氣古賦似宋玉詩歌似太白長短句似坡翁不受音律束縛者真是邦之英材間氣也韋齋龍溪豈得専美於前歟夫以方壺之望受知於文公慈湖西山三先生實焯焯自足以名世矣至於叩閽三疏極論時政六事忠肝義膽皆自學問中流出雖曰畸於人而合於天使其一語悟主豈徒曰入議論路而已世有枉道而徇時違忠而耦意者聞方壺之風亦可少愧掌書兄世克其家薈萃遺編以傳不朽惜三疏尚未之見願披訪以輯大全他日太史氏必有傳逸民者咸淳重光叶洽中秋日山隂孫嶸叟書於歙之簡肅軒文士以逸民特招如老泉以歐公後山以坡公至於韓子蒼之流皆不由科目進栁塘居士遇文公於慶元遇西山於嘉定而上不遇豈二公不能為歐蘇哉余觀西山帖欲居士俯屈以訪諸賢則其自重難進之節非招不往豈時俗佻巧馳騖於名場利區朵頥於爵標勢位者斯文金玉傳之不朽居士之遇榮矣慈湖朴實之訓實允蹈之掌書貴孫其猶子也咀其華而踐其實昔耕之而今穫矣重光叶洽嵗中秋月朔浚儀王應麟伯厚父書於歙郡齋
