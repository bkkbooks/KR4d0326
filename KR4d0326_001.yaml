body:
  text: 方壺存稿卷一宋汪莘撰書辭晦菴朱侍講書莘讀史至有國家者釁敵讎隙生於父子兄弟之間未嘗不為之傷心以至流涕也曰嗟乎父子兄弟天倫之最切者也其休戚之淺深慘舒之大小每與天地鬼神相為感動而况人乎側覩今日之事有可為傷心者哉往者不可追來者猶可為也先生勸講經筵實居師保之職前日責在大臣今日責分先生矣財不待先生而富兵不待先生而强惟主上父子之間諸公所不能濟者待先生而濟先生道大而德粹才髙而義精其必有以處此惜乎非莘之所得聞也雖然徐徐乎其為主上感動之實而汲汲乎其為泰安之居恐不可得而遂也憚於為父子深愛之本而利於為體貌臣工之末以是為治未有能久者也莘平生聞先生之風慕恱之父母如也尊敬之神明如也想像願見而不獲者凡二十年具有本末以二十年尊敬慕恱想像之心幸而一旦天與之獲見之便豈欲以背時之言撓其親而慢其神哉誠以言行素髙者流俗所忌向用頗隆則窺伺滋甚自頃諸人以道學為口實牙相磨吻相鼓加之時事多艱則名節難全端倪多變則機㑹易失今日之事先生建明稍緩竊恐言者已伺其後是非特不能為天下學道者之地亦不能為後世學道者之地矣主上發明詔設優賞以待言者莘實志不在焉大不能了莘性命小不能救莘饑寒所為來上封事拳拳惟以主上父子之間為務非敢輕也始為之疑而終為之不必疑始為之畏而終於無可畏躊躇四顧而慮之甚周其言之甚明其施之必效諸公視之以為背時之論莫有能舉而行之者是以徘徊京都日夜待先生至不同流俗不避權要建明於羣昏之中鼓動於皆醉之際言衆人之所不敢言辨衆人之所不能辨然後先生素履之志可不諭而孚經綸之業可次第而舉莘所上封事所論主上父子間與民窮吏汚之弊既己獻諸先生矣先生嘗諭之曰所論過宫事甚好當說與諸公今治行西歸敢復以告此所謂先生事也先生責也於莘何有哉冒瀆師嚴無任激切恐懼之至辨天地交泰辨月令孟春有天氣下降地氣上騰之文後世說易之泰者率取是以為證以余思之如但以孟春天氣下降地氣上騰為天地交泰不知自孟春之外如何為天地交泰耶是有十一箇月天地不交也夫四時行而百物生時無一時而不行物無一時而不生一月天地之氣不交則一月之物失其生生之理矣一日天地之氣不交則一日之物失其生生之理矣故曰以月令孟春天氣下降地氣上騰為天地交泰者不知天地交泰者也是皆未嘗深察夫天地之所以為髙下日月之所以為往來則不能知夫隂陽之所以為升降宜乎不能知天地之所以為交泰也今請先言天地之所以為髙下日月之所以為往來則知隂陽之所以為升降而後天地之所以為交泰可見矣張湛曰自地以上皆天也若是則曰天亦太虗而已矣橫渠曰地物也天神也顧有地斯有天若其配然耳是皆以太虗為天莊周蓋嘗言之六合之外聖人存而不論六合之內聖人論而不議是自莊周以六合為有內外也程明道父子兄弟嘗與邵康莭先生飲於天津橋上問天地所依之處康莭遂劇談天地之狀以及六合之外是自康莭以六合為有內外也近時吕東萊以為六合安得有內外欲朱晦菴於濓溪書後削去此條豫以為不然非好異說也請折𠂻於易易之說非異也在易之乾曰天行健如以太虗之象為天是無動無靜也安得謂之行健乎揚子雲曰馴乎𤣥渾行無窮止象天是皆所見者渾天也由是觀之四方上下為六合之宇安得而無內外乎是故黃帝書曰天在地外水在天外表裏皆水兩儀渾轉乘氣而浮載水而行又曰地在太虗之中大氣舉之漢上朱子發以水為氣亦非是康莭謂地輪依水輪水輪依風輪風輪依虗空虗空無所依此為得其實云地輪依水輪即載水而行是也水輪依風輪即乘氣而浮是也其曰地在太虗之中大氣舉之大氣即風輪是矣康莭謂風澤洞虗金剛乘天此皆言天地之下有澤有風澤非地上之澤風非地上之風也金剛乘天者金剛之氣舉之也列子謂渤海之東有歸墟焉其下為無底之壑此皆所謂風澤洞虗者是也康莭謂風輪依虗空虗空無所依即所謂六合之外是也如是而天地之所以為髙下見矣乾下坤上而為泰吾以是知天之入於地下也坤下乾上而為否吾以是知天之出於地上也水載地而浮天者也故坎上乾下而為需吾以是知天之入於水中也坎下乾上而為訟吾以是知天之出於水上也而日月則麗乎天者也離下坤上而為明夷吾以是知日之入於地中也坤下離上而為晉吾以是知日之出於地上也坎上離下而為既濟吾以是知日之入於水中也坎下離上而為未濟吾以是知日之出於水上也明夷之上九曰初登於天後入於地初登於天蓋日自地下無底之壑而登於天也後入於地蓋日自天而降遂入乎大地之下而過乎無底之墟也如是而日月之所以為升降見矣故凡以太虗空洞為天者皆不知天者也是故天旋於外而包地者也地凝於內而承天者也水載地而浮天者也莊子曰天之蒼蒼其正色耶其逺而無所至極耶其視下也亦若是則已矣蓋言夫蒼蒼非天之正色徒以逺而視成蒼蒼之色耳易曰乾為大赤橫渠曰赤者天之正色何以言其然也易曰乾陽物也天也者太虗之中有物之最大者乃純陽之氣為此大物其初為純陽故其色為大赤其大不可量則其氣何可當况夫天者純陽之體而日者又太陽之精是故一晝夜之間而天行有升有降一天行之間而日月有往有來天之降而入乎地之下而過乎無底之壑也而純陽之體一日而一蒸之日之降而入乎地之下而過乎無底之壑也而純陽之精一日而一蒸之於是大地之下無底之壑觱沸騰湧或擊而為雷霆或鬱而為雲霧上蒸磅礴而磅礴厚於是翕隂陽交泰之氣而藴蓄之既有以培養夫萬物之根又竅於山川又騰為雨露而復有以滋潤夫萬物之枝條而暢茂其華實日既負太陽之氣以下交於九地之下而月又負太隂之氣以上交於九天之中於是隂陽之氣無一時而不交泰而萬物生生之理亦無一時而不相浹洽於交泰之中而隂陽之所以為升降天地之所以為交泰見矣天下之人但見夫天位乎上地位乎下萬物位乎其中而皆不知其所以然者蔽於耳目之所及而不能通乎耳目之表如使其知有六合之外者乃知天地之中有太虗天地之外有太虗天地之中太虗有量天地之外太虗無窮豫因論天地交泰得以極言之夫所謂交者要知聖人只是舉君子道長而謂之交即此自可以知彼非於孟春之外無上下交之時也說說諸家詩世謂詩人能為詩詩人果能為詩乎蓋太虗間皆詩也詩人所見無非詩凡天地日星雲月風霆烟雨之變化山川草木蟲魚神鬼生人萬物之狀類君臣父子兄弟夫婦朋友之大倫皇帝王霸道德風俗之殊治亂盛衰之變賢人君子貴賤得失否泰消息之機與夫羲文洙泗之傳避秦隱商之志瞿曇黃老之道是皆詩之散在太虗間者而人各以其所得詠歌之為詩於是詩之散乎太虗者聚見於詩人之作則詩雖人為之而非人能自為也其智能見之其才能模寫之爾惟其智不能見之其才不能模寫之則詩之散在太虗間者邈焉初不相干惟其智能見之其才能模寫之則詩之生生者無窮詩人之作亦與之生生無窮世或硜然以詩自矜與泛然技夫詩者皆自其所見者小耳惟博觀詩然後詩之散者聚道之偏者全曩以為小者今見其大也雖然夫詩有道有權顔孟有詩人之道而伊周得詩人之權徒詩不能以用其身有權而後其詩足以用天下是故其詞可以觀其才其才可以觀其道其道可以觀其時有其才無其道君子惜其才有其道無其時君子惜其道喜於得其一惜於失其二喜於得其二樂於得其三以子之所甚樂知豫之所甚不樂也故豫之觀詩其事之感乎其中者為之喜為之悲而其詞之歌舞乎其中者其趣皆不勝其自得也因書其略以告有志於詩者歌行水天月歌朝立寒溪東暮立寒溪西一到神頓領熟視眼更迷水光不見水但見青天無表裏天光不見天但見一片清烟涵無邉水中有天天不濕天中有水水不入天耶水耶墮渺茫只是天光與水光月來水天中水天裹月如不裹月去水天中水天鎖月如不鎖明月不來不去時琉璃泡中珠一顆先自水天莫分別更添月色更親切水色天色月色擘不開水光天光月光拈不來夢中酒渴不可忍一口吸下驪龍腮擊鼓行栁塘有狂士酒䦨好擊鼓殷出黃金骨裏淚摻出白玉心中苦此苦知為何人家寒宵心事亂如麻岑牟肯戴紅槿帽蹀足不數漁陽撾翻手作春杏開早覆手秋風葉如掃開元天子是天工那知塵起長安道我今擊鼓一聲髙徹天擊鼓一聲深徹泉天上拂開白日路地鎖掣斷如飛烟豺狼聞之腦內裂狐鼠粉碎臭滿穴惟有蒼鱗火鬛雙虬龍薾雲揈雷雨騷屑青天洗出古時青日月洗出古時明百榖草木催發生鸞鳳亦作簫韶鳴走上半空望五嶽插天截海蟠金城我皇無為人自寧此時方表鼓中聲寫作栁塘擊鼓行放歌行口中吐佛子腰間出神仙眉心紅日大如錢腦宫誦經聲泠然瞿曇黃老去我久可使舉世終無傳天亦若忌我我自夢裏知其天團團清光中本來面目常現前分明是真不是想水中月影鏡中像自從別後見君稀一朝邂逅成歡賞見亦不可擬得亦不可强知音相逢只彈指得喪窮通且涵養芙蓉芰荷顛倒披九天風露流肝脾俯觀人世不忍棄世人棄我良非癡有時憤悶須痛飲長歌市上相追隨左挾田先生右拍樊於期狗屠在前武陽後擊筑叱起髙漸離揚雄但能識竒字未識以道御之無不宜一舞神鬼哭再舞雷電飛三舞乾坤悉清净却視萬物生光輝我衰不能作伊尹手把犂鋤墾蚯蚓亦復不能作吕望垂絲磻溪上但願漢家宗社牢化權何必吾人操但願紫微宫南太微北中間七箇能甄陶君不見張三裹青衫李四著紫袍黃金轉多官轉髙孔丘盜跖那復辨長蛇封豕爭雄豪我欲告天天肯否旁人竊笑婦搖手不如開眼明月前莫教失却清風後杜子美李太白清風為魂月為魄至今來往天地間幾回獨把欄干拍方壺存稿卷一
