body:
  text: 徐誼書誼頓首再拜叔耕秘正契友誼妄意欲以文學履行上之於朝前書已常畧陳之矣今移牒州縣使備書吏筆札就宅上抄録著述又嘗以書嘱南老運幹董督其事若春間畢事便當從南昌附奏恐州縣未悉此意先自納之官劵以為紙筆之需辱領畧幸甚百懐續得叙布不宣誼頓首再拜
