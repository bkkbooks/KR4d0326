  text: 欽定四庫全書
  hash: sha256:64d9ff2e7643d8cd3464e7f4c9e75c7d6d85eb6ee80c540d6dcbeeab187b9ddc
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0326_WYG_004-1a, image: WYG1178/WYG1178-0137c.png}
body:
  text: 方壺存禍卷四宋汪莘撰詩餘水調歌頭東坡云明月幾時有把酒問青天本於太白問月云青天有月來幾時太白云今人不見古時月本於抱朴子云今月不及古月之朗抱朴子所言非綺語也深思而得之誠有此理嘉定元年中秋日因賦水調其夜無月聽說古時月皎潔勝今時今人但見今月也道似琉璃君看少年眸子那比嬰兒神彩投老又堪悲明月不再盛玉斧亦何為約東坡招太白試尋思慿誰斫却裏面桂影數千枝憶在無懷天上仍在有虞宫殿看月到陳隋別有一輪月萬古沒成虧乳燕飛寄劉閬風祭酒晚趂西湖約到湖頭烟消日出波生兩腳日挈白魚携碧酒要與詩人對酌把樓上珠簾捲却坐對荷花三萬朵念西鄰未嫁肌如削待折與不堪著別來又見秋蕭索恨無由將余風月伴君雲鶴想見登山臨水處醉把茱茰槃礴唱白雪陽春新作憶自東籬人去後算人間黃菊空零落嘆作者命多薄浪淘沙與外甥吳晉良逰落石天末起凉風雲氣匆匆如今何處有英雄獨佩一壺溪上去秋水澄空絶壁聳雲中倒掛青松醉歌漢殿與秦宫日現山西留不住目送飛鴻滿江紅自賦萬古灰飛算何用黃金滿屋吾老矣幾畨重九幾杯醽醁此日登臨多恨別明年强健何由卜且喚教兒女逐人來尋黃菊蘋巳白楓猶緑鱸已晚橙初熟嘆人間何事稍如吾欲五栁愛尋王母使三閭好作湘妃曲向飄風涷雨返柴扉騎黃犢菩薩蠻問言何處秋光好當年曽過常州道一望沒遮欄天寬水亦寬也因輕靄曉也伴斜暉討指㸃與君看畫他難不難桃源憶故人人間只解留春住不管秋光歸去一陳西忩風雨秋也歸何處柴扉半掩閒庭户黃葉青苔無數猶把小春分付梅蕊前村路浣沙溪九日青女催人兩鬢霜自篘白酒作重陽方壺老子莫凄凉天地兩三蝴蝶夢古今多少菊花香只將破帽送秋光漢宫春春色平分甚偏他楊栁分外風流夭桃自適其適一笑還休可憐仙李對東風却少溫柔爭奈得海棠粧㸃向人渾不知羞誰覺韶華如夢到酴醿開後鶯語供愁天教姚黃晚出貴與王侔花中隱者有春蘭秋菊俱優須是到溪山清凍江梅香噴枝頭小重山居士情懷愛小春恰如重㑹面舊時人東君輕笑又輕顰知道我春去却傷心青鳥下紅巾瑶池春信早莫因循栁絲黃日牡丹晨相隨逐春淺到春深䀨龍謡夢下瑶臺神飛閬苑自嘆塵寰久客三入成周望居帝宅蕩蘭槳伊闕波濤曵玉杖洛陽阡陌獨躊躇武烈文謨天垂晚月生魄故人少別懷多引壺觴自酌誰憐衰白羣仙問我尚低頭方冊共雲將東過扶搖遇鴻濛頓超𤣥默待功成翳鳳騎麟把蟠桃摘水龍吟當年剪彩垂髫超然便欲為仙去世間俗狀人心狡計不堪同住每坐空山獨臨古澗神閒意寓想瀛州雞犬蓬萊猿鶴應悵望門前路自昔侯王將相幾畨成落花飛絮仰天醉眼興雲妙手年華遲莫長揖烟塵靜朝日月誰知幽素正風清麟背星垂海角曉鐘初寤水調歌頭懷吳中諸友孔孟化塵土秦漢共丘墟人間美惡如夢試看幾張書還是天一地二做出朝三暮四堪笑又堪悲誰憶陶元亮春酒解饑劬老將至嵗既晏念春歸停雲親友南北何以慰離居半村半郭佳處一竹一花生意吾亦愛吾廬時訪前村酒旋買小溪魚滿江紅不敢賦梅賦感梅洞府瑶池多是見桃紅滿地君試問江梅清絶因何拋棄仙境常如二三月此花不受春風醉被販兒俚婦折來看添憔悴泛雪艇搖氷枻溪館靜烟扉閉須祁寒徹骨清香透鼻孤竹赤松真我友姚黃魏紫非吾契笑方壺日夜繞南枝猶多事淵明云髙峯尋吾契沁園春掛黃山圖十二軸恰滿一室覺此身真在黃山中也賦此詞寄天都峯下王道者家在栁塘傍住方壺圖掛黃山覺仙峯六六滿堂峭峻仙溪六六繞屋潺湲行到水窮坐看雲起只在吾廬尋丈間非人世但鶴飛深谷猿嘯髙岩如今老疾蹣跚向畫裏嬉逰卧裏看甚花開花落悄無人見山南山北誰似余閒住箇庵兒了些活計月白風清人倚欄山中友類先秦氣貌後晉衣冠行香子臘八日與洪仲簡溪行其夜雪作野店殘冬緑酒春濃念如今此意誰同溪光不盡山翠無窮有幾枝梅幾竿竹幾株松籃輿乘興薄暮踈鐘望孤村斜日匆匆夜忩雪陳曉枕雲峯便擁漁簔頂漁笠作漁翁又雪後晚眺策杖溪邉倚杖峯前望瓊林玉樹森然誰家殘雪何處孤烟向一溪橋一茅店一漁船別般天地新樣山川喚家僮訪鶴尋猿山深寺逺雲冷鐘殘喜竹間燈梅間屋石間泉水調歌頭雪中篘酒却得三十六壺乃酬黃山之神而歌以侑之釀秫小春月取酒雪花晨滿壺插破浮蟻湧起碧鱗鱗誰覺東風密至更帶梅香潛入甕裏淨無塵一見酒之面便得酒之心這畨酒未及賓黃山圖就舊日境界喜重新三十六峯雲嶂三十六溪烟水三十六壺春寄語黃山道我是境中人鵲橋仙欲雪倘來無定浮生如寄休說真非真是道人半睡半醒時全身在碧霄宫裏風師四起雲君六合茅舍有何准擬待他雪陳打忩來旋披起半床紙被杏花天有感美人家在江南住每惆悵江南日暮白蘋州畔花無數還憶瀟湘風度幸自是斷腸無處怎强作鶯聲燕語東風占斷秦筝柱也逐落花歸去减字木蘭花詩家清絶簷外森然蒼玉節學易無思一笑忩前白玉妃何人共說山上青松松上雪更有誰知溪在門前月在溪西江月問松張文潛詩有東海大松序云土人相傳三代時物徐仲車先生和之余意古松之散在天地間柱青天而蔽厚地者可以數計周知欲合而處之不可得也作松問天下老松有數人間不記何年海心嶽頂寺門前我欲收成一片為向此公傳語却教老子隨緣龍盤虎踞負青天豈若吾身親見卜算子立春日賦夏則飲紅泉冬則飱紅术一片新春入手來不費些兒力春在水無痕春在山無色李白桃紅未吐時好個春消息南鄉子茅舍起踈烟家在寒溪阿那邉修竹當籬梅當户蕭然問是堯天是葛天風雨入新年惟恐春隂咽管絃緑酒一樽歌一曲人傳不屬天仙屬散仙好事近雪後金叔潤相挽溪行挽我過溪橋請與春風權攝推出雲峯千文照碧溪春色別來三度見梅花今日共君說只這溪山十里剩幾多風月又春有三變曰孟仲季天分四象曰曉夕晝夜自是而出有不可勝言者矣約而賦之風日未全春又是春來風日不出方壺門户見東皇消息此時春事苦無多春意最端的却被草芽引去向栁梢收得右孟春春早不知春春晚又還無味一㸃日中星鳥想堯民如醉不寒不暖杏花天花到半開處正是太平風景為人間留住右仲春風雨打黃昏啼殺滿山杜宇到得人間春去問英雄何處桃紅李白競春光誰共殘粧語最是梨花一樹照誰家庭户右季春閬苑夢回時忩外數聲啼鳥覺我床前天氣便清明多少詩人門户約花開宿蝶悮飛了一段山青水緑作洞庭春曉右春晚夾岸隘桃花花下蒼苔如積驀地輕寒一陳上桃花顔色東鄰西舍絶經過新月是相識白玉欄干斜倚作蓬山春夕右春夕滿庭芳雨中再賦牡丹雲繞花屏天橫練帶畫堂三月初三斜風細雨羅幕護輕寒無數天香國色枝枝帶洛浦嵩山燒紅燭吞星日光射九霞冠仙宫深幾許黃鶯問道紫燕窺簾似太真姊妹半醒微酣須信生來富貴何曽在草舍茅庵皇州近扁舟載去春色冠東南韓魏公詠牡丹云管絃圍簇生來富貴謁金門使君再招飲牡丹如山坐上賦此簷溜滴都是春歸消息帶雨牡丹無氣力黃鸝愁雨濕爭看洛陽春色忘却連天草碧南浦緑波雙槳急沙頭人佇立玉樓春贈別孟倉使一片江南春色晚牡丹花謝鶯聲懶問君離恨幾多長芳草連天猶覺短昨夜溪頭新溜滿樽前自起噴龍管明朝飛棹下錢塘心共白蘋香不斷摘句金風玉露洗出乾坤體頭上青天蕩蕩足下白雲靄和氣自悠揚造物原來無物有物還應自造人意幾曽平愛影拈將燈取惜香放下簾遮賦梅我有春風怎生賣早春虛過了尚有二分是處春光好收買蛺蝶引春來杜鵑趣春歸算何如桃李渾無言說開落忘機方壺存稿卷四
